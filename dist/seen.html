<script type="module">
// ---- src/rng.js
// Seeded random streams. Each consumer gets its own stream keyed by a stable
// name, so adding a consumer never shifts another's draws. A stream's whole
// state is four integer words, so it saves as plain JSON.

// Hash the seed text first: raw small seeds give alike first draws.
function hasher(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489917);
    return (h ^= h >>> 16) >>> 0;
  };
}

function makeStream(seed, name) {
  const h = hasher(String(seed) + ':' + name);
  const s = [h(), h(), h(), h()];
  for (let i = 0; i < 12; i++) next(s);
  return s;
}

// sfc32 stepped in place on the four words; returns a float in [0, 1).
function next(s) {
  let a = s[0] | 0, b = s[1] | 0, c = s[2] | 0, d = s[3] | 0;
  const t = (((a + b) | 0) + d) | 0;
  d = (d + 1) | 0;
  a = b ^ (b >>> 9);
  b = (c + (c << 3)) | 0;
  c = (c << 21) | (c >>> 11);
  c = (c + t) | 0;
  s[0] = a; s[1] = b; s[2] = c; s[3] = d;
  return (t >>> 0) / 4294967296;
}

// ---- seen/src/sim.js
// Seen: a second-person game. You cross twelve rooms before dawn, choosing one
// of three doors in each. The tower knows nothing about the rooms that you do
// not: it only models you. Before every choice it seals a guess at your door;
// if the guess is right you are seen and held, which costs hours. The whole
// game is a pure function of the seed, the model it starts with and the picks.

const ROOMS = 12;
const HOURS = 29;   // dawn: tuned by tests/sim.test.mjs so chance play escapes a little over half the time
const SHORT = 1;    // hours through the short door
const LONG = 2;     // hours through either long door
const HELD = 2;     // hours lost each time the tower's sealed guess was your door
const HONEST = 0.5; // how often the door the tower names is the door it expects

// What the tower keeps about one person: counts of what they did in each
// situation, and how far each way of reading them has earned trust.
function newModel() {
  return { v: 1, runs: 0, escapes: 0, rooms: 0, hits: 0, tables: {}, weights: {} };
}

// Each expert reads one aspect of a door (where it is, whether it is the short
// one, whether the tower named it, how far it is from the last door) in one
// situation. `ctx` returns the situation as a string, or null if it has none yet.
const last = (h) => h[h.length - 1];
const EXPERTS = [
  { name: 'pos',        aspect: 'pos',   ctx: () => '' },
  { name: 'posAfter',   aspect: 'pos',   ctx: (h) => (h.length ? 'p' + last(h).pick : null) },
  { name: 'shift',      aspect: 'shift', ctx: (h) => (h.length ? (last(h).seen ? 'seen' : 'free') : null) },
  { name: 'short',      aspect: 'short', ctx: () => '' },
  { name: 'shortAfter', aspect: 'short', ctx: (h) => (h.length ? (last(h).short === last(h).pick ? 's' : 'l') + (last(h).seen ? 'seen' : 'free') : null) },
  { name: 'shortRun',   aspect: 'short', ctx: (h) => (h.length > 1 ? h.slice(-2).map((r) => (r.short === r.pick ? 's' : 'l')).join('') : null) },
  { name: 'shortTempo', aspect: 'short', ctx: (h) => (h.length ? (last(h).slow ? 'slow' : 'fast') : null) },
  { name: 'shortClock', aspect: 'short', ctx: (h, s) => (s.hours + (ROOMS - s.room) * 1.6 > HOURS ? 'late' : 'early') },
  { name: 'named',      aspect: 'named', ctx: () => '' },
  { name: 'namedAfter', aspect: 'named', ctx: (h) => (h.length ? (last(h).pick === last(h).claim ? 'took' : 'left') + (last(h).claim === last(h).sealed ? 'true' : 'lie') : null) },
];
const USES_CLAIM = (e) => e.aspect === 'named';
const ETA = 1.5;

// The value of an aspect for door d, and how many of the three doors share it.
function aspectOf(e, d, s, claim) {
  const h = s.history;
  if (e.aspect === 'pos') return [d, 1];
  if (e.aspect === 'shift') return [(d - last(h).pick + 3) % 3, 1];
  if (e.aspect === 'short') return d === s.short ? ['y', 1] : ['n', 2];
  return d === claim ? ['y', 1] : ['n', 2];
}
const SIZE = { pos: 3, shift: 3, short: 2, named: 2 };

// One expert's probability for each door, from its counts with one imagined
// observation spread over the outcomes so nothing is ever impossible.
function expertDoors(model, e, s, claim) {
  const c = e.ctx(s.history, s);
  if (c === null) return null;
  const row = model.tables[e.name + '|' + c] || {};
  let n = 0;
  for (const k in row) n += row[k];
  const out = [0, 0, 0];
  for (let d = 0; d < 3; d++) {
    const [val, share] = aspectOf(e, d, s, claim);
    out[d] = ((row[val] || 0) + 1 / SIZE[e.aspect]) / (n + 1) / share;
  }
  return out;
}

function mixture(model, s, claim) {
  const out = [0, 0, 0];
  let total = 0;
  for (const e of EXPERTS) {
    if (claim === null && USES_CLAIM(e)) continue;
    const p = expertDoors(model, e, s, claim);
    if (!p) continue;
    const w = model.weights[e.name] ?? 1;
    total += w;
    for (let d = 0; d < 3; d++) out[d] += w * p[d];
  }
  return out.map((x) => x / total);
}

function argmax(p, rng) {
  let best = [0];
  for (let d = 1; d < 3; d++) {
    if (p[d] > p[best[0]] + 1e-12) best = [d];
    else if (Math.abs(p[d] - p[best[0]]) <= 1e-12) best.push(d);
  }
  return best[Math.floor(next(rng) * best.length)];
}

function createRun(seed, model = newModel()) {
  const s = {
    seed: String(seed), rooms: makeStream(seed, 'rooms'), tower: makeStream(seed, 'tower'),
    room: 0, hours: 0, seen: 0, status: 'play', history: [], model,
    short: 0, claim: 0, sealed: 0,
  };
  enterRoom(s);
  return s;
}

// The tower names a door aloud, then seals its real guess, both before the pick.
function enterRoom(s) {
  s.short = Math.floor(next(s.rooms) * 3);
  const first = argmax(mixture(s.model, s, null), s.tower);
  s.claim = next(s.tower) < HONEST ? first : (first + 1 + Math.floor(next(s.tower) * 2)) % 3;
  s.sealed = argmax(mixture(s.model, s, s.claim), s.tower);
}

// Take door `pick` (0 left, 1 middle, 2 right). `slow` is whether the real
// person hesitated before choosing; it is the one thing here the character
// in the room does not have.
function step(s, pick, slow = false) {
  if (s.status !== 'play' || !(pick >= 0 && pick < 3)) return null;
  const m = s.model;
  // Learn: move trust toward the experts that expected this door, then count it.
  let sum = 0;
  const grown = {};
  for (const e of EXPERTS) {
    const p = expertDoors(m, e, s, s.claim);
    if (!p) continue;
    grown[e.name] = (m.weights[e.name] ?? 1) * Math.pow(p[pick] * 3, ETA);
    sum += grown[e.name];
  }
  const names = Object.keys(grown);
  for (const k of names) m.weights[k] = Math.max(0.02, grown[k] * names.length / sum);
  for (const e of EXPERTS) {
    const c = e.ctx(s.history, s);
    if (c === null) continue;
    const key = e.name + '|' + c;
    const [val] = aspectOf(e, pick, s, s.claim);
    (m.tables[key] ||= {})[val] = (m.tables[key][val] || 0) + 1;
  }
  const seen = pick === s.sealed;
  const cost = (pick === s.short ? SHORT : LONG) + (seen ? HELD : 0);
  const entry = { room: s.room, short: s.short, claim: s.claim, sealed: s.sealed, pick, seen, slow: !!slow, cost };
  s.history.push(entry);
  s.hours += cost;
  if (seen) { s.seen += 1; m.hits += 1; }
  m.rooms += 1;
  s.room += 1;
  if (s.hours > HOURS) s.status = 'dawn';
  else if (s.room >= ROOMS) s.status = 'escaped';
  if (s.status === 'play') enterRoom(s);
  else { m.runs += 1; if (s.status === 'escaped') m.escapes += 1; }
  return entry;
}

// The habits the tower would say aloud: situations it has seen at least
// `min` times in which you did the same thing at least `sure` of the time.
const DOOR = ['left', 'middle', 'right'];
const WORDS = {
  pos: (c, v) => `You take the ${DOOR[v]} door`,
  posAfter: (c, v) => `After the ${DOOR[c[1]]} door you take the ${DOOR[v]} one`,
  shift: (c, v) => `After I ${c === 'seen' ? 'see' : 'miss'} you, you ${v === '0' ? 'take the same door again' : 'change doors'}`,
  short: (c, v) => `You take the ${v === 'y' ? 'short' : 'long'} way`,
  shortAfter: (c, v) => `After a ${c[0] === 's' ? 'short' : 'long'} door that I ${c.endsWith('seen') ? 'saw' : 'missed'}, you take the ${v === 'y' ? 'short' : 'long'} way`,
  shortRun: (c, v) => `After ${c === 'ss' ? 'two short doors' : c === 'll' ? 'two long doors' : c === 'sl' ? 'short then long' : 'long then short'}, you go ${v === 'y' ? 'short' : 'long'}`,
  shortTempo: (c, v) => `When you ${c === 'slow' ? 'hesitate' : 'choose quickly'}, your next door is the ${v === 'y' ? 'short' : 'long'} way`,
  shortClock: (c, v) => `When dawn is ${c === 'late' ? 'close' : 'far'}, you take the ${v === 'y' ? 'short' : 'long'} way`,
  named: (c, v) => `You ${v === 'y' ? 'take' : 'avoid'} the door I name`,
  namedAfter: (c, v) => `After you ${c.startsWith('took') ? 'took' : 'refused'} my door and I had ${c.endsWith('true') ? 'told the truth' : 'lied'}, you ${v === 'y' ? 'take' : 'avoid'} the door I name`,
};
function habits(model, { min = 5, sure = 0.7, most = 3 } = {}) {
  const found = [];
  for (const key in model.tables) {
    const [name, c] = key.split('|');
    const row = model.tables[key];
    let n = 0;
    for (const k in row) n += row[k];
    if (n < min) continue;
    for (const v in row) {
      let count = row[v], value = v;
      // "Change doors" is the two shifted outcomes together.
      if (name === 'shift' && v !== '0') { if (v === '2' && row['1']) continue; count = (row['1'] || 0) + (row['2'] || 0); value = '1'; }
      const chance = name === 'pos' || name === 'posAfter' ? 1 / 3 : name === 'shift' ? (value === '0' ? 1 / 3 : 2 / 3) : value === 'y' ? 1 / 3 : 2 / 3;
      const rate = count / n;
      if (rate < sure || rate - chance < 0.2) continue;
      found.push({ text: WORDS[name](c, value), count, n, lift: rate - chance, aspect: EXPERTS.find((e) => e.name === name).aspect });
    }
  }
  // Strongest first, and one habit for each kind of thing it reads, so the
  // same habit is not said three ways.
  found.sort((a, b) => b.lift * Math.sqrt(b.n) - a.lift * Math.sqrt(a.n));
  const kinds = new Set();
  return found.filter((f) => !kinds.has(f.aspect) && kinds.add(f.aspect)).slice(0, most);
}

// ---- src/save.js
// Settings and best score. Keys are namespaced because the page may share its
// web origin with other projects, and every access is wrapped because storage
// can throw (private mode, blocked site data, a full quota).
const PREFIX = 'bst1.glowmoth.';

function load(key, fallback, store = globalThis.localStorage) {
  try {
    const raw = store.getItem(PREFIX + key);
    return raw === null || raw === undefined ? fallback : JSON.parse(raw);
  } catch { return fallback; }
}

function save(key, value, store = globalThis.localStorage) {
  try { store.setItem(PREFIX + key, JSON.stringify(value)); return true; } catch { return false; }
}

// The same two calls under another project's prefix, for other games that
// share this engine and this web origin.
function createStore(prefix, store) {
  const at = () => store || globalThis.localStorage;
  return {
    load(key, fallback) {
      try {
        const raw = at().getItem(prefix + key);
        return raw === null || raw === undefined ? fallback : JSON.parse(raw);
      } catch { return fallback; }
    },
    save(key, value) {
      try { at().setItem(prefix + key, JSON.stringify(value)); return true; } catch { return false; }
    },
  };
}

// ---- seen/src/main.js
// The page around the simulation: it shows the room, times how long the real
// person takes to choose, and keeps the tower's model of them on this device.

const store = createStore('bst1.seen.');
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const pause = params.has('fast') ? 0 : 1700;   // how long an opened seal stays on screen
let model = store.load('model.v1', null) || newModel();
let run = null, mode = 'title', shownAt = 0, locked = false, runCount = 0;

// The tower speaks about "the prisoner" until it has watched a few rooms, then
// turns to "you": by then what it says is about the person, not the character.
const knowsYou = () => model.rooms >= 4;

function showRoom() {
  const doors = document.querySelectorAll('.door');
  doors.forEach((el, d) => {
    el.className = 'door' + (d === run.short ? ' short' : '') + (d === run.claim ? ' named' : '');
    el.querySelector('.hours').textContent = (d === run.short ? SHORT + ' hour' : LONG + ' hours');
    el.disabled = false;
  });
  $('room').textContent = `Room ${run.room + 1} of ${ROOMS}`;
  $('left').textContent = `${Math.max(0, HOURS - run.hours)} h to dawn`;
  $('dawn').style.width = Math.min(100, (run.hours / HOURS) * 100) + '%';
  $('pupil').style.transform = `translateX(${(run.claim - 1) * 7}px)`;
  $('say').innerHTML = `${knowsYou() ? 'You' : 'The prisoner'} will take the <b>${DOOR[run.claim]}</b> door.`;
  $('note').className = '';
  $('note').textContent = run.room === 0 ? 'My guess is already sealed. Choose a door.' : '';
  locked = false;
  shownAt = performance.now();
}

function choose(d) {
  if (mode !== 'play' || locked) return;
  locked = true;
  // Slow means slow for this person: longer than one and a half times their own usual.
  const took = performance.now() - shownAt;
  const t = (model.tempo ||= { n: 0, sum: 0 });
  const slow = t.n >= 3 && took > 1.5 * (t.sum / t.n);
  t.n += 1; t.sum += Math.min(took, 20000);
  const before = habits(model, { most: 1 })[0];
  const e = step(run, d, slow);
  store.save('model.v1', model);
  document.querySelectorAll('.door').forEach((el, i) => {
    el.disabled = true;
    el.classList.toggle('picked', i === e.pick);
    el.classList.toggle('sealed', i === e.sealed);
  });
  $('tower').classList.toggle('blink', !e.seen);
  $('dawn').style.width = Math.min(100, (run.hours / HOURS) * 100) + '%';
  $('left').textContent = `${Math.max(0, HOURS - run.hours)} h to dawn`;
  const you = knowsYou();
  const lied = e.claim !== e.sealed ? ` I named another to move ${you ? 'you' : 'them'}.` : '';
  $('note').className = e.seen ? 'seen' : 'free';
  $('note').textContent = e.seen
    ? `I sealed the ${DOOR[e.sealed]} door.${lied} I saw ${you ? 'you' : 'the prisoner'}: ${HELD} hours held.${before && you ? ' ' + before.text + '.' : ''}`
    : `I sealed the ${DOOR[e.sealed]} door.${lied} ${you ? 'You' : 'The prisoner'} went ${DOOR[e.pick]}, past me.`;
  setTimeout(() => { $('tower').classList.remove('blink'); run.status === 'play' ? showRoom() : finish(); }, pause);
}

function finish() {
  mode = 'over';
  runCount += 1;
  const h = run.history, seen = run.seen, escaped = run.status === 'escaped';
  const known = habits(model);
  const rate = Math.round((model.hits / model.rooms) * 100);
  $('play').hidden = true;
  $('card').hidden = false;
  $('title').textContent = escaped ? 'Out before dawn' : 'Dawn';
  $('title').className = escaped ? 'escaped' : 'dawn';
  $('body').innerHTML = `
    <p>${escaped ? `You crossed all ${ROOMS} rooms with ${HOURS - run.hours} hours to spare.` : `The light came up in room ${h.length} of ${ROOMS}.`}
    I had sealed your door in ${seen} of ${h.length} rooms; guessing blind would get about ${Math.round(h.length / 3)}.</p>
    <div id="marks" role="img" aria-label="Rooms where the sealed guess was your door">${h.map((r) => `<i class="${r.seen ? 'seen' : 'free'}" title="Room ${r.room + 1}: sealed ${DOOR[r.sealed]}, you took ${DOOR[r.pick]}"></i>`).join('')}</div>
    <h2>What I know about you</h2>
    ${known.length ? `<ul id="habits">${known.map((k) => `<li>${k.text}. <span>${k.count} times in ${k.n}</span></li>`).join('')}</ul>`
      : `<p>Nothing I can use yet. ${model.rooms < 20 ? 'I have not watched you long.' : 'You are hard to read.'}</p>`}
    <p id="truth">There is no one in the tower. It is this game, and it was never watching the prisoner: it has kept what you did in ${model.rooms} rooms over ${model.runs} ${model.runs === 1 ? 'night' : 'nights'},
    on this device only, and has guessed ${rate}% of your doors. Each guess was fixed before you chose.</p>`;
  $('go').textContent = 'Another night';
  $('forget').hidden = false;
  $('go').focus();
}

function title() {
  mode = 'title';
  $('play').hidden = true;
  $('card').hidden = false;
  $('title').textContent = 'Seen';
  $('title').className = '';
  $('body').innerHTML = `<p>Twelve rooms stand between a prisoner and the wall, and dawn is ${HOURS} hours off. Each room has three doors: the lit one takes ${SHORT} hour, the others ${LONG}.</p>
    <p>The tower cannot see into the rooms. Before each choice it seals one guess at the door, and names a door aloud, which may or may not be the one it sealed. If the sealed door is the one taken, the prisoner is held for ${HELD} hours.</p>
    ${model.runs ? `<p id="truth">I remember you: ${model.runs} ${model.runs === 1 ? 'night' : 'nights'}, ${model.rooms} rooms.</p>` : ''}`;
  $('go').textContent = 'Begin';
  $('forget').hidden = !model.runs;
}

function begin() {
  const seed = params.get('seed') ? params.get('seed') + ':' + runCount : String(Date.now());
  run = createRun(seed, model);
  mode = 'play';
  $('card').hidden = true;
  $('play').hidden = false;
  showRoom();
}

$('go').addEventListener('click', begin);
$('forget').addEventListener('click', () => { model = newModel(); store.save('model.v1', model); title(); });
document.querySelectorAll('.door').forEach((el) => el.addEventListener('click', () => choose(Number(el.dataset.door))));
addEventListener('keydown', (ev) => {
  if (ev.repeat || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const d = { 1: 0, 2: 1, 3: 2, ArrowLeft: 0, ArrowDown: 1, ArrowUp: 1, ArrowRight: 2 }[ev.key];
  if (mode === 'play' && d !== undefined) { ev.preventDefault(); choose(d); }
  else if (mode !== 'play' && (ev.key === 'Enter' || ev.key === ' ') && document.activeElement?.tagName !== 'BUTTON') { ev.preventDefault(); begin(); }
});

title();
window.__game = { get mode() { return mode; }, get locked() { return locked; }, state: () => run, model: () => model };
</script>
